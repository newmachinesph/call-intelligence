name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Placeholders so the app imports; tests never call providers or databases.
      CALL_INTELLIGENCE_SENTRY_DISABLED: "1"
      UPSTASH_WORKFLOW_URL: https://qstash.example.invalid
      QSTASH_TOKEN: ci-placeholder
      QSTASH_CURRENT_SIGNING_KEY: ci-placeholder
      QSTASH_NEXT_SIGNING_KEY: ci-placeholder
      PROCESSING_SERVICE_SECRET: ci-placeholder
      JWT_ISSUER: http://127.0.0.1:3000
      JWT_AUDIENCE: http://127.0.0.1:3000
      JWT_JWKS_URL: http://127.0.0.1:3000/api/auth/jwks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff check call_intelligence_api tests
      - run: uv run --locked pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json  # pnpm version comes from web's packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
