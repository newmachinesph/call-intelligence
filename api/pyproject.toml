    "alembic==1.20.0",
    "boto3==1.43.103",
    "certifi==2026.7.22",
    "fastapi==0.141.1",
    "mutagen==1.48.1",
    "openai==3.19.2",
    "psycopg[binary,pool]==3.3.6",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.0",
    "sentry-sdk==2.70.0",
